name: Lean

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /usr/local/.ghcup \
                      /usr/share/swift \
                      /usr/local/share/powershell \
                      /usr/local/share/chromium || true
          df -h /

      - uses: leanprover/lean-action@v1
