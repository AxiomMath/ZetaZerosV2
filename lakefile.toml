name = "ZetaZeros"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZetaZeros", "ZetaZeros.Unconditional"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "ZetaZeros"

# The comparator pair. Deliberately NOT in defaultTargets: `Challenge` carries a
# permanent `sorry` (its statements are the artifact), and `lake lint` derives its
# scope from the default targets. The comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Classical analytic inputs vendored from anthropics/formal-math (zeta23/), Apache-2.0; see
# NOTICE and Vendored/Zeta23.lean. Module names retain their upstream `Zeta23.` prefix.
[[lean_lib]]
name = "Zeta23"
srcDir = "Vendored"

[lean_lib.leanOptions]
weak.linter.mathlibStandardSet = false

# Zero-free-region input vendored from plby/lean-proofs; see NOTICE and the preserved license.
[[lean_lib]]
name = "ErdosProblems"
srcDir = "Vendored"

[lean_lib.leanOptions]
weak.linter.mathlibStandardSet = false
